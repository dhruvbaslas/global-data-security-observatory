<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security: Content Security Policy -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Global Data Security Observatory — Explore, compare, and analyze data protection policies across countries worldwide. Interactive dashboard with scoring, rankings, and insights."
    />
    <meta
      name="keywords"
      content="data security, data protection, GDPR, privacy laws, global compliance, data observatory"
    />
    <meta name="author" content="Global Data Security Observatory" />

    <!-- Open Graph / Social Meta -->
    <meta property="og:title" content="Global Data Security Observatory" />
    <meta
      property="og:description"
      content="Explore, compare, and analyze data protection policies and sovereign benchmarks across all 197 UN nations worldwide."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dhruvbaslas.github.io/global-data-security-observatory/" />
    <meta property="og:image" content="https://dhruvbaslas.github.io/global-data-security-observatory/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Global Data Security Observatory" />
    <meta
      name="twitter:description"
      content="Compare data security policies and statutory benchmarks across all 197 sovereign UN nations."
    />
    <meta name="twitter:image" content="https://dhruvbaslas.github.io/global-data-security-observatory/social-preview.png" />

    <!-- Favicon: Shield emoji rendered as SVG data URI -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>"
    />

    <title>Global Data Security Observatory</title>
  </head>
  <body>
    <!-- 
      Accessible skip-to-content link for keyboard users.
      Visually hidden until focused.
    -->
    <noscript>
      <p>You need JavaScript enabled to run this application.</p>
    </noscript>

    <!-- React root mount point -->
    <div id="root"></div>

    <!-- Main application entry point (ES module) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
